# App-of-apps: syncs every Application manifest under gitops/apps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: console-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/agrigorev94/kargo-demo.git
    targetRevision: main
    path: gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
